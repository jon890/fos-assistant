name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # 한국 시간 매일 04:23. 변경이 없어도 외부 의존성과 흔들리는 검사를 확인한다.
    - cron: '23 19 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: 백엔드 테스트
        working-directory: backend
        run: ./gradlew test
      # H2 는 정렬 규칙이 다른 칸의 비교 같은 MySQL 고유의 실패를 내지 않는다. 운영과 같은 판과 기본 정렬 규칙으로 띄워
      # 마이그레이션과 저장소 쿼리를 검사한다.
      - name: 실제 MySQL 검사
        run: scripts/check-mysql-migration.sh

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.22.0
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: 웹 빌드
        env:
          AUTH_SECRET: build-time-placeholder
          ASSISTANT_JWT_SECRET: build-time-placeholder
          CONTROL_PLANE_BASE_URL: http://build-time-placeholder
          AUTH_GOOGLE_ID: build-time-placeholder
          AUTH_GOOGLE_SECRET: build-time-placeholder
        run: pnpm build

  browser:
    name: browser-${{ matrix.project }}-shard-${{ matrix.shard }}
    # runner 마다 웹, Control Plane, H2 메모리 DB 를 새로 띄운다. job 안에서는 직렬로 돈다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop]
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # 바뀐 spec을 base와 비교해 연속 통과를 검사한다.
          fetch-depth: 0
      # 브라우저 검사의 globalSetup 이 Control Plane 도 띄운다.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.22.0
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Chromium 캐시
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # 웹 서버를 띄우기 전에 빌드하고 그 결과를 띄운다(test/browser/web-server.ts). 따로 빌드하지 않는다.
      - name: 브라우저 shard 검사
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-report-${{ matrix.project }}-${{ matrix.shard }}.json
        run: pnpm test:browser --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4 --reporter=list,json
      # 전체 검사가 통과한 뒤에도 변경 spec과 매일 회귀 묶음은 재시도 없이 3회 연속 통과해야 한다.
      # JSON 결과는 마지막 단계의 결과로 바꿔, 반복 단계에서 실패한 spec도 기존 실패 이슈 집계에 들어간다.
      - name: 브라우저 변경 spec 연속 통과
        working-directory: .
        env:
          BROWSER_STABILITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-report-${{ matrix.project }}-${{ matrix.shard }}.json
        run: node scripts/browser-stability.mjs --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4
      - name: 브라우저 JSON 결과
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report-${{ matrix.project }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-report-${{ matrix.project }}-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7
      - name: 실패하거나 취소된 브라우저 검사 결과
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results-${{ matrix.project }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          # Playwright 설정의 outputDir 은 os.tmpdir() 아래에 있다.
          path: /tmp/fos-assistant-playwright-results-*
          if-no-files-found: ignore
          retention-days: 7

  browser-required:
    name: browser-${{ matrix.project }}
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: 폭별 shard 결과 판정
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/browser-ci.mjs check ${{ matrix.project }} 4

  browser-failures:
    name: browser-failures
    needs: browser
    if: >-
      always() && needs.browser.result != 'success' &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: browser-failure-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: browser-report-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-reports
          merge-multiple: true
      - name: main 브라우저 실패 이슈 집계
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/browser-ci.mjs issues "$RUNNER_TEMP/browser-reports"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: node test/e2e/run.ts

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: node --test 'test/unit/**/*.test.ts'
      - name: 마이그레이션 버전 검사
        env:
          # PR 은 main 의 base, push 는 직전 main, 정기 실행은 현재 main 과 비교한다.
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node scripts/check-migration-versions.mjs "$MIGRATION_BASE"

  hermes:
    name: hermes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: python -m pip install 'mcp==2.0.0' 'PyYAML==6.0.3'
      - run: bash scripts/check-connectors.sh
      - run: python -m unittest discover -s hermes/tests -v
      # dashboard-profile-api 가 기대는 Hermes 내부 지점을 계약의 판 소스에서 확인한다(ADR-088).
      - run: bash scripts/check-hermes-contract.sh

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 바뀐 파일만 검사하는 도구(Spotless, OpenRewrite, Prettier)가 origin/main 이력을 쓴다. 깊이를 제한하지 않고 모두 받는다.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.22.0
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
      - run: scripts/quality.sh check

  public-safe:
    name: public-safe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 공개 정보 검사
        env:
          DENYLIST_PATTERNS: ${{ secrets.PUBLIC_REPO_DENYLIST }}
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          chmod 700 "$work"
          printf '%s\n' "$DENYLIST_PATTERNS" > "$work/denylist"
          chmod 600 "$work/denylist"
          if [ -z "$DENYLIST_PATTERNS" ]; then
            printf '%s\n' '알림: PUBLIC_REPO_DENYLIST secret 이 비어 형태 패턴만 검사한다.'
          fi
          unset DENYLIST_PATTERNS
          # 위반한 줄에도 비공개 값이 있을 수 있어 검사 원문은 로그에 내지 않는다.
          if PUBLIC_REPO_DENYLIST="$work/denylist" scripts/check-public-safe.sh > "$work/check.log" 2>&1; then
            printf '%s\n' '통과: 공개 저장소에 적으면 안 되는 것을 찾지 못했다.'
          else
            status=$?
            printf '%s\n' '::error::공개 정보 검사에 실패했다. 비공개 값 보호를 위해 상세 출력은 생략한다.'
            exit "$status"
          fi
