name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # 한국 시간 매일 04:23. 변경이 없어도 외부 의존성과 흔들리는 검사를 확인한다.
    - cron: '23 19 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 경로 판정과 짧은 공개 정보 검사가 checkout을 공유한다. 필수 이름은 유지한다.
  changes:
    name: public-safe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      web: ${{ steps.paths.outputs.web }}
      browser: ${{ steps.paths.outputs.browser }}
      e2e: ${{ steps.paths.outputs.e2e }}
      hermes: ${{ steps.paths.outputs.hermes }}
      quality: ${{ steps.paths.outputs.quality }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: 바뀐 파일로 실행할 검사 선택
        id: paths
        run: node scripts/ci/ci-paths.mjs changes
      - name: 공개 정보 검사
        env:
          DENYLIST_PATTERNS: ${{ secrets.PUBLIC_REPO_DENYLIST }}
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          chmod 700 "$work"
          printf '%s\n' "$DENYLIST_PATTERNS" > "$work/denylist"
          chmod 600 "$work/denylist"
          if [ -z "$DENYLIST_PATTERNS" ]; then
            printf '%s\n' '알림: PUBLIC_REPO_DENYLIST secret 이 비어 형태 패턴만 검사한다.'
          fi
          unset DENYLIST_PATTERNS
          # 위반한 줄에도 비공개 값이 있을 수 있어 검사 원문은 로그에 내지 않는다.
          if PUBLIC_REPO_DENYLIST="$work/denylist" scripts/checks/check-public-safe.sh > "$work/check.log" 2>&1; then
            printf '%s\n' '통과: 공개 저장소에 적으면 안 되는 것을 찾지 못했다.'
          else
            status=$?
            printf '%s\n' '::error::공개 정보 검사에 실패했다. 비공개 값 보호를 위해 상세 출력은 생략한다.'
            exit "$status"
          fi

  backend-tests:
    name: backend-${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, mysql]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: 실제 plugin 왕복 시험의 Python 의존성
        run: python -m pip install 'mcp==2.0.0' 'PyYAML==6.0.3'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      # Java HTTP 검사가 현재 Python catalog producer와 TS compiler를 합성 원고로 실행한다.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: 원고 snapshot 합성 fixture 준비
        run: |
          bun install --cwd hermes/connectors/naver-blog --frozen-lockfile
          bun run --cwd hermes/connectors/naver-blog build
      # 금융 producer 왕복 검사가 tossinvest 테스트 원본을 생성하고 금융 SDK를 bundle한다.
      - name: 금융 producer 왕복 fixture 의존성
        run: bun install --cwd hermes/connectors/tossinvest --frozen-lockfile
      - name: 백엔드 테스트
        if: matrix.suite == 'unit'
        working-directory: backend
        run: ./gradlew test
      # H2 는 정렬 규칙이 다른 칸의 비교 같은 MySQL 고유의 실패를 내지 않는다. 운영과 같은 판과 기본 정렬 규칙으로 띄워
      # 마이그레이션과 저장소 쿼리를 검사한다.
      - name: 실제 MySQL 검사
        if: matrix.suite == 'mysql'
        run: scripts/checks/check-mysql-migration.sh

  backend:
    name: backend
    needs: [changes, backend-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: 변경 판정과 검사 결과 확인
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.backend }}
          JOB_RESULT: ${{ needs.backend-tests.result }}
        run: node scripts/ci/ci-paths.mjs gate

  web:
    name: web
    needs: [changes, quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: 통합한 quality job 결과 확인
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$QUALITY_RESULT" != success ]; then
            echo "::error::quality job이 성공하지 않았다: $QUALITY_RESULT"
            exit 1
          fi
      - name: 변경 판정과 검사 결과 확인
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.web }}
          JOB_RESULT: ${{ needs.quality.outputs.web-result }}
        run: node scripts/ci/ci-paths.mjs gate

  browser:
    name: browser-${{ matrix.project }}-shard-${{ matrix.shard }}
    # runner 마다 웹, Control Plane, H2 메모리 DB 를 새로 띄운다. job 안에서는 직렬로 돈다.
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop]
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # 바뀐 spec을 base와 비교해 연속 통과를 검사한다.
          fetch-depth: 0
      # 브라우저 검사의 globalSetup 이 Control Plane 도 띄운다.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.22.0
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Chromium 캐시
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # 웹 서버를 띄우기 전에 빌드하고 그 결과를 띄운다(test/browser/web-server.ts). 따로 빌드하지 않는다.
      - name: 브라우저 shard 검사
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-report-${{ matrix.project }}-${{ matrix.shard }}.json
        run: pnpm test:browser --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 --reporter=list,json
      # 전체 검사가 통과한 뒤에도 변경 spec과 매일 회귀 묶음은 재시도 없이 3회 연속 통과해야 한다.
      # JSON 결과는 마지막 단계의 결과로 바꿔, 반복 단계에서 실패한 spec도 기존 실패 이슈 집계에 들어간다.
      - name: 브라우저 변경 spec 연속 통과
        working-directory: .
        env:
          BROWSER_STABILITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-report-${{ matrix.project }}-${{ matrix.shard }}.json
        run: node scripts/ci/browser-stability.mjs --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
      - name: 브라우저 JSON 결과
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report-${{ matrix.project }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-report-${{ matrix.project }}-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7
      - name: 실패하거나 취소된 브라우저 검사 결과
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results-${{ matrix.project }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          # Playwright 설정의 outputDir 은 os.tmpdir() 아래에 있다.
          path: /tmp/fos-assistant-playwright-results-*
          if-no-files-found: ignore
          retention-days: 7

  browser-required:
    name: browser-${{ matrix.project }}
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: 변경 판정과 검사 결과 확인
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.browser }}
          JOB_RESULT: ${{ needs.browser.result }}
        run: node scripts/ci/ci-paths.mjs gate
      - name: 폭별 shard 결과 판정
        if: needs.changes.outputs.browser == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/browser-ci.mjs check ${{ matrix.project }} 3

  browser-failures:
    name: browser-failures
    needs: browser
    if: >-
      always() && needs.browser.result != 'success' &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: browser-failure-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: browser-report-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-reports
          merge-multiple: true
      - name: main 브라우저 실패 이슈 집계
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/browser-ci.mjs issues "$RUNNER_TEMP/browser-reports"

  e2e-tests:
    name: e2e-tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: node test/e2e/run.ts
      - name: 실패한 E2E의 합성 백엔드 로그
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-backend-log-attempt-${{ github.run_attempt }}
          path: /tmp/fos-assistant-e2e-results-*/backend.log
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    needs: [changes, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: 변경 판정과 검사 결과 확인
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.e2e }}
          JOB_RESULT: ${{ needs.e2e-tests.result }}
        run: node scripts/ci/ci-paths.mjs gate

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: node --test 'test/unit/**/*.test.ts'
      - name: 마이그레이션 버전 검사
        env:
          # PR 은 main 의 base, push 는 직전 main, 정기 실행은 현재 main 과 비교한다.
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node scripts/checks/check-migration-versions.mjs "$MIGRATION_BASE"
      - name: 기능 문서 covers 검사
        if: github.event_name == 'pull_request'
        env:
          FEATURE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/check-feature-covers.mjs "$FEATURE_BASE"

  hermes-tests:
    name: hermes-tests
    needs: changes
    if: needs.changes.outputs.hermes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: python -m pip install 'mcp==2.0.0' 'PyYAML==6.0.3' 'Pillow==12.3.0'
      - name: 합성 DOM 회귀용 Chrome 설치 확인
        run: |
          test -x /usr/bin/google-chrome || { echo '합성 DOM 회귀에 실제 Chrome 설치가 필요합니다.' >&2; exit 1; }
          /usr/bin/google-chrome --version
      - name: 커넥터 배포 묶음과 기존 HTTP 대역 검사
        run: bash scripts/ci/check-connector-package.sh
      - run: python -m unittest discover -s hermes/tests -v
      # dashboard-profile-api 가 기대는 Hermes 내부 지점을 계약의 판 소스에서 확인한다(ADR-088).
      - run: bash scripts/checks/check-hermes-contract.sh

  hermes:
    name: hermes
    needs: [changes, hermes-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: 변경 판정과 검사 결과 확인
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.hermes }}
          JOB_RESULT: ${{ needs.hermes-tests.result }}
        run: node scripts/ci/ci-paths.mjs gate

  quality:
    name: quality
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      web-result: ${{ steps.web-tests.outcome }}
    steps:
      - name: 변경 판정 확인
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.quality }}
          WEB_RUN: ${{ needs.changes.outputs.web }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$SHOULD_RUN" = true || test "$SHOULD_RUN" = false
          test "$WEB_RUN" = true || test "$WEB_RUN" = false
      # 바뀐 파일만 검사하는 도구(Spotless, OpenRewrite, Prettier)가 origin/main 이력을 쓴다. 깊이를 제한하지 않고 모두 받는다.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 파일 길이 검사
        run: node scripts/checks/check-file-length.mjs
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: needs.changes.outputs.quality == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        if: needs.changes.outputs.quality == 'true'
      - run: python3 test/spotless-jdt.test.py
        if: needs.changes.outputs.quality == 'true'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: needs.changes.outputs.quality == 'true' || needs.changes.outputs.web == 'true'
        with:
          version: 10.22.0
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.quality == 'true' || needs.changes.outputs.web == 'true'
        with:
          node-version: '22.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
        id: install
        if: needs.changes.outputs.quality == 'true' || needs.changes.outputs.web == 'true'
      # 파일 길이 기준 목록도 quality.sh 에서 검사한다.
      - run: scripts/checks/quality.sh check
        if: needs.changes.outputs.quality == 'true'
      # quality와 웹 검사가 pnpm 설치와 캐시를 공유한다. 웹 단계의 결과를 web 판정에 전달한다.
      - name: 웹 테스트와 타입 검사, 빌드
        id: web-tests
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' && steps.install.outcome == 'success' }}
        working-directory: web
        env:
          AUTH_SECRET: build-time-placeholder
          ASSISTANT_JWT_SECRET: build-time-placeholder
          CONTROL_PLANE_BASE_URL: http://build-time-placeholder
          AUTH_GOOGLE_ID: build-time-placeholder
          AUTH_GOOGLE_SECRET: build-time-placeholder
        run: |
          pnpm test:node
          pnpm typecheck
          pnpm build
