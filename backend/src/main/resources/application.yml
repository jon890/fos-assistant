spring:
  application:
    name: fos-assistant-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      # 기본 상한 1MB 로는 휴대폰 사진 대부분이 서비스 판정 전에 걸린다.
      # 한 장 상한 10MB 보다 조금 크게 두어, 조금 넘는 것은 서비스가 입력 오류로 거절하게 한다
      max-file-size: 11MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 요청 상한을 넘은 본문은 읽기 전에 거절되고, 남은 본문이 이 값보다 크면 Tomcat 이 연결을 끊는다.
    # 그러면 입력 오류 응답이 클라이언트에 닿지 못한다. 요청 상한보다 넉넉히 두어 사진 몇 장 크기까지는
    # 응답을 돌려준다
    max-swallow-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health

assistant:
  agents:
    # 사용자 한 사람이 만들 수 있는 에이전트 수. 지운 것은 세지 않고 ADMIN 은 세지 않는다
    max-per-user: 5
  chat:
    stop-stream-grace: 10s
    # 사건이 없는 동안 SSE 주석 줄을 보내는 간격. 앞단 프록시가 약 100초 동안 바이트가 없으면 연결을 끊는다
    stream-heartbeat: ${ASSISTANT_CHAT_STREAM_HEARTBEAT:20s}
    # 고를 수 있는 모델 목록을 profile 마다 메모리에 들고 있는 시간. 지나면 Hermes 에 다시 묻는다
    model-options-ttl: 10m
  context:
    max-chars: 8000
    index-budget-ratio: 4
  memory:
    propose:
      enabled: false
  auth:
    jwt-secret: ${ASSISTANT_JWT_SECRET}
  attachment:
    # 대화에 올린 사진을 두는 공유 디렉터리. 기본값을 두지 않아 없으면 기동에 실패한다
    root: ${ASSISTANT_ATTACHMENT_ROOT}
    # 같은 디렉터리를 Hermes 컨테이너에서 보는 경로. 값을 둘로 두는 것이 아니라 두 컨테이너가 같은
    # 디렉터리를 다른 마운트 지점으로 보는 것이다. 에이전트에게는 이 경로를 알린다. 기본값이 없다
    agent-root: ${ASSISTANT_ATTACHMENT_AGENT_ROOT}
    max-files: 10
    max-bytes: 10485760
    retention-days: 30
    # 보관 기간이 지난 사진을 지우는 시각. Control Plane 의 시간대를 따른다
    cleanup-cron: "0 0 4 * * *"
  artifact:
    # 에이전트가 대화마다 결과물 파일을 두는 공유 디렉터리. 기본값을 두지 않아 없으면 기동에 실패한다.
    # 보관 기간이 지난 파일을 Control Plane 이 지우므로 쓰기로 붙인다
    root: ${ASSISTANT_ARTIFACT_ROOT}
    # 같은 디렉터리를 Hermes 컨테이너에서 보는 경로. 에이전트에게는 이 경로를 알린다. 기본값이 없다
    agent-root: ${ASSISTANT_ARTIFACT_AGENT_ROOT}
    # 파일이 마지막으로 바뀐 때부터 센다. 지우는 시각은 첨부의 cleanup-cron 을 함께 쓴다
    retention-days: 30
    source:
      # 실제 이미지 공급자 호스트는 운영 설정에서 검토해 넣는다. 비어 있으면 주소 방식만 거절한다.
      allowed-hosts: []
      connect-timeout: 5s
      read-timeout: 10s
      total-timeout: 30s
  mcp:
    # profile 이 묶이지 않은 옛 MCP 토큰을 그 토큰의 사용자로 돌릴지. 토큰마다 profile 을 묶는 동안에만 참으로 두는
    # 전환용 설정이다. 거짓이면 그런 토큰은 401 이다(ADR-032)
    legacy-user-tokens: ${ASSISTANT_MCP_LEGACY_USER_TOKENS:false}
  pricing:
    # models.dev 카탈로그를 복사해 둔 경로. 없으면 실행 비용을 비워 두고 기동은 계속한다
    catalog-path: ${ASSISTANT_PRICING_CATALOG:}
hermes:
  profile-key-dir: ${HERMES_PROFILE_KEY_DIR}
  # profile 을 만드는 대시보드 주소와 그 대시보드에 보낼 토큰. 기본값을 두지 않아 없으면 기동에 실패한다
  dashboard-base-url: ${HERMES_DASHBOARD_BASE_URL}
  dashboard-token: ${HERMES_DASHBOARD_TOKEN}
  # 모든 profile 을 /p/<profile> 로 받는 listener 의 주소. 첫 로그인에 만드는 에이전트가 이 주소를 쓴다
  shared-listener-base-url: ${HERMES_SHARED_LISTENER_BASE_URL}
  poll-interval: 700ms
  run-timeout: 5m

logging:
  level:
    com.bifos.assistant: INFO
