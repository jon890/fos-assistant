spring:
  application:
    name: fos-assistant-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      # 기본 상한 1MB 로는 휴대폰 사진 대부분이 서비스 판정 전에 걸린다.
      # 한 장 상한 10MB 보다 조금 크게 두어, 조금 넘는 것은 서비스가 입력 오류로 거절하게 한다
      max-file-size: 11MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 요청 상한을 넘은 본문은 읽기 전에 거절되고, 남은 본문이 이 값보다 크면 Tomcat 이 연결을 끊는다.
    # 그러면 입력 오류 응답이 클라이언트에 닿지 못한다. 요청 상한보다 넉넉히 두어 사진 몇 장 크기까지는
    # 응답을 돌려준다
    max-swallow-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health

assistant:
  agents:
    # 사용자 한 사람이 만들 수 있는 에이전트 수. 지운 것은 세지 않고 ADMIN 은 세지 않는다
    max-per-user: 5
  chat:
    stop-stream-grace: 10s
    # 사건이 없는 동안 SSE 주석 줄을 보내는 간격. 앞단 프록시가 약 100초 동안 바이트가 없으면 연결을 끊는다
    stream-heartbeat: ${ASSISTANT_CHAT_STREAM_HEARTBEAT:20s}
    # 고를 수 있는 모델 목록을 profile 마다 메모리에 들고 있는 시간. 지나면 Hermes 에 다시 묻는다
    model-options-ttl: 10m
  model-tiers:
    # 실행할 때 읽지 않는다. 기동할 때 정의 행이 없는 그룹에 한 번 옮기고, 옮긴 뒤 운영 설정에서 지운다(ADR-054).
    fast:
      provider: ${ASSISTANT_MODEL_TIERS_FAST_PROVIDER:}
      model: ${ASSISTANT_MODEL_TIERS_FAST_MODEL:}
      reasoning-effort: ${ASSISTANT_MODEL_TIERS_FAST_REASONING_EFFORT:}
    balanced:
      provider: ${ASSISTANT_MODEL_TIERS_BALANCED_PROVIDER:}
      model: ${ASSISTANT_MODEL_TIERS_BALANCED_MODEL:}
      reasoning-effort: ${ASSISTANT_MODEL_TIERS_BALANCED_REASONING_EFFORT:}
    deep:
      provider: ${ASSISTANT_MODEL_TIERS_DEEP_PROVIDER:}
      model: ${ASSISTANT_MODEL_TIERS_DEEP_MODEL:}
      reasoning-effort: ${ASSISTANT_MODEL_TIERS_DEEP_REASONING_EFFORT:}
  context:
    max-chars: 8000
    index-budget-ratio: 4
    result-stale-after: 6h
  memory:
    propose:
      enabled: false
    encryption:
      # 민감 Memory 본문을 암호화하는 key 다(ADR-055). 둘 다 비우면 기동은 되고 민감 항목의 저장과 수정, 암호화한 줄의 읽기만 거절한다
      # 새로 쓸 때 쓰는 key 의 id
      active-key-id: ${ASSISTANT_MEMORY_ENCRYPTION_ACTIVE_KEY_ID:}
      # <id>:<base64 32바이트> 를 쉼표로 이은 목록. 옛 key 를 남겨 두어야 옛 줄을 읽는다
      keys: ${ASSISTANT_MEMORY_ENCRYPTION_KEYS:}
  delegation:
    # 새 자식이 가질 수 있는 가장 깊은 깊이. 사용자가 부른 실행이 0 이다
    max-depth: 2
    # 한 루트 실행 아래에서 동시에 도는 위임 자식 수
    max-concurrent-children: 4
    # 서버 전체에서 동시에 도는 위임 수
    max-active: 16
    # agent_delegate 가 Hermes 제출을 기다리는 시간. 넘으면 실행 번호만 돌려주고 결과는 그 실행 줄에 적는다
    submit-timeout: 30s
    # 실행 줄에 적는 위임 답의 길이 상한. 넘으면 자르고 잘렸다는 한 줄을 붙인다
    output-max-chars: 100000
    # agent_status 의 wait_seconds 로 맡긴 실행이 끝나기를 기다리는 시간의 상한. 더 긴 값은 이 값으로 줄인다.
    # 기다리는 동안 그 도구 호출이 Hermes turn 을 붙잡으므로 hermes.run-timeout 보다 훨씬 짧게 둔다
    status-wait-max: 20s
  user-execution:
    # 한 사용자가 Hermes 에 동시에 맡길 수 있는 실행 수. turn 자리와 RUNNING 실행 줄의 합이다(ADR-069)
    max-running: 4
    # 추천 질문과 Memory 제안이 돈 뒤에도 남겨 둘 사용자 자리 수
    background-reserve: 1
    # Hermes 에서 끝났는지 모르는 run 의 자리를 쥐는 상한. 비우면 hermes.run-timeout 과 같다
    remote-end-max-wait: ${ASSISTANT_USER_EXECUTION_REMOTE_END_MAX_WAIT:}
  connector:
    # 한 사용자가 동시에 돌릴 수 있는 선택지 조회, 등록, 연결 확인 수
    max-concurrent-calls: 1
    # 한 사용자가 60초 동안 돌릴 수 있는 그 호출 수. 상태는 JVM 메모리에 둔다
    calls-per-minute: 10
    policy:
      # 도구 호출 판정이 쓰는 카탈로그를 메모리에 두는 시간. 지나면 다음 판정이 대시보드에서 다시 읽는다(ADR-049)
      catalog-ttl: 60s
      # 카탈로그 읽기 실패를 기억하는 시간. 그동안 판정은 대시보드를 다시 부르지 않고 바로 거절한다
      catalog-failure-ttl: 5s
      # 승인 요청이 사용자의 답을 기다리는 시간. 지나면 실행하지 않고 만료로 둔다(ADR-050)
      approval-ttl: 24h
      # 답이 없는 승인 요청을 만료로 바꾸는 주기
      expire-cron: "0 * * * * *"
  restart-reconcile:
    # 기동할 때 RUNNING 으로 남은 실행을 Hermes 에 물어 정한다(ADR-061). 끄면 그 줄이 그대로 남는다
    enabled: true
    # 다시 붙어 기다리는 상한. 비우면 hermes.run-timeout 과 같다. 넘으면 중지를 보내고 FAILED 로 적는다
    max-wait: ${ASSISTANT_RESTART_RECONCILE_MAX_WAIT:}
  delegation-wake:
    # 맡긴 일의 결과가 끝나면 부모 대화의 turn 을 자동으로 연다(ADR-040)
    enabled: true
    # 사용자의 질문 없이 이어서 여는 turn 의 수. 닿으면 알림 줄만 남긴다
    max-auto-turns: 10
  starters:
    # 새 대화 화면의 추천 질문을 모델로 만든다. 결과는 메모리에만 둔다(ADR-036)
    enabled: true
    # 대화를 마쳤을 때 이보다 오래된 추천만 다시 만든다
    refresh-after: 24h
    # 추천을 만들 때 읽는 그 사용자의 최근 대화 수
    history-conversations: 20
    # 만들기가 실패한 뒤 같은 사용자와 에이전트의 추천을 다시 만들지 않는 시간
    retry-after-failure: 10m
  proactive-check:
    # 먼저 살펴보기(ADR-080). 꺼 두면 살펴보기를 시작하지 않는다
    enabled: true
    # 살펴보기 turn 하나가 돌 수 있는 시간. hermes.run-timeout 보다 짧지 않으면 기동에 실패한다
    max-duration: 4m
    # 살펴보기 turn 하나가 시작할 수 있는 도구 호출 수
    max-tool-calls: 40
    # 살펴보기 트리에서 맡길 수 있는 위임 자식 수. 0 이면 맡기지 않는다
    max-delegations: 3
    # 점검 대화의 루트 session 하나로 보내는 살펴보기 수. 닿으면 session 을 바꾼다
    session-max-checks: 14
    # 최근에 알린 발견으로 읽는 기간. 같은 것을 다시 알리지 않는 판정과 다음 입력에 쓴다
    digest-window: 30d
    # 다음 살펴보기의 입력에 싣는 최근 발견 수
    digest-max-items: 20
  auth:
    jwt-secret: ${ASSISTANT_JWT_SECRET}
  attachment:
    # 대화에 올린 사진을 두는 공유 디렉터리. 기본값을 두지 않아 없으면 기동에 실패한다
    root: ${ASSISTANT_ATTACHMENT_ROOT}
    # 같은 디렉터리를 Hermes 컨테이너에서 보는 경로. 값을 둘로 두는 것이 아니라 두 컨테이너가 같은
    # 디렉터리를 다른 마운트 지점으로 보는 것이다. 에이전트에게는 이 경로를 알린다. 기본값이 없다
    agent-root: ${ASSISTANT_ATTACHMENT_AGENT_ROOT}
    max-files: 30
    max-bytes: 10485760
    retention-days: 30
    # 보관 기간이 지난 사진을 지우는 시각. Control Plane 의 시간대를 따른다
    cleanup-cron: "0 0 4 * * *"
  artifact:
    # 에이전트가 대화마다 결과물 파일을 두는 공유 디렉터리. 기본값을 두지 않아 없으면 기동에 실패한다.
    # 보관 기간이 지난 파일을 Control Plane 이 지우므로 쓰기로 붙인다
    root: ${ASSISTANT_ARTIFACT_ROOT}
    # 같은 디렉터리를 Hermes 컨테이너에서 보는 경로. 에이전트에게는 이 경로를 알린다. 기본값이 없다
    agent-root: ${ASSISTANT_ARTIFACT_AGENT_ROOT}
    # 파일이 마지막으로 바뀐 때부터 센다. 지우는 시각은 첨부의 cleanup-cron 을 함께 쓴다
    retention-days: 30
    source:
      # 실제 이미지 공급자 호스트는 운영 설정에서 검토해 넣는다. 비어 있으면 주소 방식만 거절한다.
      allowed-hosts: []
      connect-timeout: 5s
      read-timeout: 10s
      total-timeout: 30s
  skill:
    # 에이전트에 올린 스킬을 profile 별 버전 디렉터리로 두는 공유 디렉터리. Control Plane 이 쓰고 Hermes 는
    # 읽기 전용으로 본다. 기본값을 두지 않아 없으면 기동에 실패한다
    root: ${ASSISTANT_SKILL_ROOT}
    # 같은 디렉터리를 Hermes 컨테이너에서 보는 경로. skills.external_dirs 에 이 경로를 적는다. 기본값이 없다
    agent-root: ${ASSISTANT_SKILL_AGENT_ROOT}
    # 게시에 성공한 버전 가운데 남겨 두는 수. 되돌릴 때 쓴다
    keep-versions: 3
    # 에이전트 하나에 올릴 수 있는 스킬 수. 새 스킬을 만들 때만 본다
    max-per-agent: ${ASSISTANT_SKILL_MAX_PER_AGENT:30}
  notification:
    # 알림을 남기는 기간. 읽었는지와 상관없이 지난 줄을 지운다
    retention: 90d
    # 보관 기간이 지난 알림을 지우는 시각. Control Plane 의 시간대를 따른다
    cleanup-cron: "0 30 4 * * *"
    # 사건이 없는 동안 알림 SSE 에 주석 줄을 보내는 간격. 앞단 프록시가 연결을 끊지 않게 한다
    stream-heartbeat: 20s
  task:
    # 발화기와 시작 단계가 도는 때(초 포함 6필드). 검사에서는 - 로 끈다
    dispatch-cron: "*/30 * * * * *"
    # 이만큼 늦은 예정 시각은 놓친 것으로 보지 않는다
    missed-grace: 2m
    # QUEUED 줄이 만들어진 뒤 이만큼 열리지 못하면 SKIPPED(BUSY) 로 닫는다
    start-timeout: 10m
    # 사용자당 보관하지 않은 예약 작업 수(ADR-079)
    max-per-user: 10
    # 반복 시각의 최소 간격. 이보다 짧은 cron 은 만들 때 거절한다(ADR-079)
    min-interval: 15m
    # 사용자당 24시간 안의 발화 수(ADR-079)
    max-runs-per-day: 48
    # 시간대를 비운 작업의 시간대
    default-time-zone: Asia/Seoul
  attention:
    # 실패한 turn 을 지금 화면에 보이는 기간
    failure-window: 7d
    # 끝난 위임을 맡긴 일 카드에 보이는 기간
    delegated-window: 24h
    # 도는 위임이 이만큼 지나면 NOW 가 된다
    long-running-after: 30m
    # 기한이 이만큼 남으면 할 일이 지금 볼 것이 된다
    due-soon: 24h
    # 이어서 하기 카드의 항목 상한
    continue-count: 5
    # 이어서 하기를 뺀 카드 하나의 항목 상한. 넘으면 moreCount 로 센다
    max-items-per-card: 10
    # 미루기 기한의 상한. 지금부터 이만큼 뒤까지만 받는다
    snooze-max: 8d
    # 지표 사건을 남기는 기간. 지난 줄은 cleanup-cron 에 지운다
    event-retention: 90d
    # 보관 기간이 지난 지표 사건을 지우는 시각. Control Plane 의 시간대를 따른다
    cleanup-cron: "0 30 4 * * *"
  pricing:
    # models.dev 카탈로그를 복사해 둔 경로. 없으면 실행 비용을 비워 두고 기동은 계속한다
    catalog-path: ${ASSISTANT_PRICING_CATALOG:}
hermes:
  profile-key-dir: ${HERMES_PROFILE_KEY_DIR}
  # profile 을 만드는 대시보드 주소와 그 대시보드에 보낼 토큰. 기본값을 두지 않아 없으면 기동에 실패한다
  dashboard-base-url: ${HERMES_DASHBOARD_BASE_URL}
  dashboard-token: ${HERMES_DASHBOARD_TOKEN}
  # 모든 profile 을 /p/<profile> 로 받는 listener 의 주소. 첫 로그인에 만드는 에이전트가 이 주소를 쓴다
  shared-listener-base-url: ${HERMES_SHARED_LISTENER_BASE_URL}
  poll-interval: 700ms
  run-timeout: 5m

logging:
  level:
    com.bifos.assistant: INFO
