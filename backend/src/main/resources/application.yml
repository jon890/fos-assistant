spring:
  application:
    name: fos-assistant-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

assistant:
  context:
    max-chars: 8000
  memory:
    propose:
      enabled: false
  auth:
    jwt-secret: ${ASSISTANT_JWT_SECRET}
  pricing:
    # models.dev 카탈로그를 복사해 둔 경로. 없으면 실행 비용을 비워 두고 기동은 계속한다
    catalog-path: ${ASSISTANT_PRICING_CATALOG:}
hermes:
  profile-key-dir: ${HERMES_PROFILE_KEY_DIR}
  poll-interval: 700ms
  run-timeout: 5m

logging:
  level:
    com.bifos.assistant: INFO
