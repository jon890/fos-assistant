spring:
  datasource:
    # 기본 lock timeout 2초로는 같은 에이전트에 스킬 저장을 동시에 거는 검사에서 둘째가 잠금을 기다리다 끊긴다
    url: jdbc:h2:mem:assistant;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      # Hibernate 가 기동할 때만 읽는다. 검사마다 켜면 컨텍스트가 갈라지므로 늘 켜 둔다. 질의 수는 UsageControllerTest 가 센다
      hibernate.generate_statistics: true
  flyway:
    enabled: false
    out-of-order: true

assistant:
  usage:
    reconcile-cron: "-"
  chat:
    # 검사가 뜰 때마다 지운 대화의 정리가 함께 돌지 않게 끈다. 검사는 그 메서드를 직접 부른다
    purge-cron: "-"
  context:
    max-chars: 8000
  data-encryption:
    # 운영 값이 아니다. 검사 전용 KEK 파일이다
    kek-file: src/test/resources/data-encryption/test-kek.keys
    active-kek-id: test-kek-1
  memory:
    encryption:
      # 운영 값이 아니다. 글자 0123456789abcdef0123456789abcdef 의 base64 다
      active-key-id: test-1
      keys: "test-1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  starters:
    # 추천 실행이 대역 Hermes 의 받은 명령과 응답 큐를 함께 써 다른 검사의 단언을 흔든다.
    # 추천을 보는 검사만 켠다
    enabled: false
  delegation-wake:
    # 자동 turn 이 다른 스레드에서 대역 Hermes 와 메시지를 함께 써 위임을 끝까지 돌리는 검사의 단언을 흔든다.
    # 깨우기를 보는 검사만 켠다
    enabled: false
  restart-reconcile:
    # 다른 검사가 남긴 RUNNING 줄에 백그라운드 스레드가 붙어 그 검사의 단언을 흔든다.
    # 검사는 잡기와 묻기를 직접 부른다
    enabled: false
  user-execution:
    # 같은 H2 를 쓰는 다른 검사가 남긴 RUNNING 줄과 나란히 도는 turn 이 한도에 걸리지 않게 올린다.
    # 한도 자체는 UserExecutionLimiterTest 와 한도를 보는 검사가 작은 값으로 본다
    max-running: 1000
  connector:
    max-concurrent-calls: 1
    # 검사는 같은 사용자로 짧은 시간에 여러 번 부른다. 제한 자체는 ConnectorCallLimiterTest 가 본다
    calls-per-minute: 1000
    policy:
      # 검사가 뜰 때마다 만료 정리가 함께 돌지 않게 끈다. 검사는 그 메서드를 직접 부른다
      expire-cron: "-"
      # 검사들이 컨텍스트를 함께 쓰므로 앞 검사가 읽은 커넥터 카탈로그와 읽기 실패가 다음 검사에 남지 않게 한다.
      # 캐시는 실제 시각으로 잰다. 앞 단계의 카탈로그를 지나가게 하려는 검사는 2ms 를 기다린다. 보관 시간 자체는 ConnectorCatalogCacheTest 가 본다
      catalog-ttl: 1ms
      catalog-failure-ttl: 1ms
    binding:
      # 검사가 뜰 때마다 반영 예정 확인이 함께 돌지 않게 끈다. 검사는 그 메서드를 직접 부른다
      apply-cron: "-"
  proactive-check:
    # 아래 hermes.run-timeout(1s) 보다 짧아야 기동한다. 살펴보기 turn 을 돌리는 검사는 두 값을 함께 올린다
    max-duration: 500ms
  auth:
    jwt-secret: test-secret-test-secret-test-secret-test-secret
  attachment:
    root: build/test-attachments
    # 검사는 이 경로를 열지 않고 Hermes 로 간 입력에 적힌 글자만 본다
    agent-root: /agent-side/attachments
    # 검사가 뜰 때마다 지우는 일이 함께 돌지 않게 끈다. 검사는 그 메서드를 직접 부른다
    cleanup-cron: "-"
  notification:
    # 검사가 뜰 때마다 지우는 일이 함께 돌지 않게 끈다. 검사는 그 메서드를 직접 부른다
    cleanup-cron: "-"
  attention:
    # 검사가 뜰 때마다 지우는 일이 함께 돌지 않게 끈다. 검사는 그 메서드를 직접 부른다
    cleanup-cron: "-"
  decision-feedback:
    # 검사가 뜰 때마다 지우는 일이 함께 돌지 않게 끈다. 검사는 그 메서드를 직접 부른다
    cleanup-cron: "-"
  task:
    # 검사가 뜰 때마다 발화기가 함께 돌지 않게 끈다. 검사는 그 메서드를 직접 부른다
    dispatch-cron: "-"
  artifact:
    root: build/test-artifacts
    # 검사는 이 경로를 열지 않고 Hermes 로 간 입력에 적힌 글자만 본다
    agent-root: /agent-side/artifacts
  skill:
    root: build/test-skills
    # 검사가 게시된 경로에 적힌 글자를 실제 디렉터리와 견주므로 두 루트를 같게 둔다
    agent-root: build/test-skills
  browser:
    # 기능을 켜는 검사가 이 값을 덮는다. 주소와 경로는 실재하지 않는 시험 값이다
    enabled: false
    proxy-url: https://browser-proxy.example.test
    image: example/browser:test
    network: example-browser
    cdp-port: 9999
    profile-root: build/test-browser-profiles
    profile-host-root: /example/browser-profiles
    profile-mount: /example/profile
    memory-mb: 512
    cpu: 1
    pids-limit: 256
    shm-mb: 128
  sandbox-workspace:
    # 시험 기본값은 꺼짐이다. 파일 공간 검사는 임시 디렉터리로 서비스를 직접 만든다
    root: ""
    delete-socket: ""
hermes:
  profile-key-dir: build/test-hermes-keys
  # 실재하지 않는 주소다. 이 값으로 대시보드를 부르는 테스트가 없고, 부르면 닿지 못해 실패한다
  dashboard-base-url: https://hermes-dashboard.example.com
  dashboard-token: test-dashboard-token
  # 실재하지 않는 주소다. 이 값으로 Hermes 를 부르는 테스트는 대역으로 바꿔 끼운다
  shared-listener-base-url: https://hermes-listener.example.com
  poll-interval: 10ms
  run-timeout: 1s
