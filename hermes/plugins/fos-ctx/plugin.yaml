name: fos-ctx
version: 1.3.0
description: "Control Plane MCP 호출에 서명한 run 맥락 _fos_ctx 를 붙이고, skill_manage 를 막고, delegate_task 의 자식 session 을 Control Plane 에 등록하고, 커넥터를 설치한 profile 의 커넥터 도구 호출을 Control Plane 에 물어 판정하고, 바인딩 profile 의 커넥터 도구 결과를 <external-data> 로 감싼다."
author: "fos-assistant"
hooks:
  - pre_tool_call
  - subagent_start
  - transform_tool_result
